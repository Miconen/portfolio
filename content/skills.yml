  - id: infra
    label: { fi: Infra, en: Infra }
    skills: [Docker, GitHub Actions, OpenTofu, Nix]
  - id: testing
    label: { fi: Testaus, en: Testing }
    skills: [Playwright, Vitest, Mocha, go test]
  - id: integrations
    label: { fi: Rajapinnat & integraatiot, en: APIs & integrations }
    skills: [Wise Old Man API, Discord API, discord.js, RuneProfile API, GeoGuessr API, WordPress REST API, Google Maps API, OpenWeatherMap API, MyHelsinki API]
